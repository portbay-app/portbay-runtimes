name: release-runtimes

on:
  workflow_dispatch:
    inputs:
      runtimes:
        description: "Runtimes to build: comma list of php,node,ollama,postgres,redis,mysql,nginx,httpd, or all. Unbuilt ones keep their live manifest entries."
        required: true
        default: "all"
      php_version:
        description: "PHP version to build"
        required: true
        default: "8.4.21"
      node_version:
        description: "Node version to build (LTS recommended)"
        required: true
        default: "22.14.0"
      ollama_version:
        description: "Ollama version (official darwin tarball, repacked; checksum auto-verified)"
        required: true
        default: "0.30.6"
      postgres_version:
        description: "PostgreSQL version (source build; checksum auto-verified)"
        required: true
        default: "16.4"
      redis_version:
        description: "Redis version (source build)"
        required: true
        default: "7.4.1"
      redis_sha256:
        description: "SHA-256 of redis-<version>.tar.gz (required when redis is selected)"
        required: false
        default: ""
      mysql_version:
        description: "MySQL version (official macOS tarball)"
        required: true
        default: "8.4.5"
      mysql_macos_tag:
        description: "macOS build tag in the MySQL tarball name (8.4.4/8.4.5 → macos15)"
        required: true
        default: "macos15"
      mysql_sha256_aarch64:
        description: "SHA-256 of the MySQL arm64 tarball (required when mysql is selected)"
        required: false
        default: ""
      nginx_version:
        description: "nginx version (source build; PCRE2/zlib pinned in the script)"
        required: true
        default: "1.31.6"
      httpd_version:
        description: "Apache httpd version (source build; checksum auto-verified)"
        required: true
        default: "2.4.68"
      release_tag:
        description: "Release tag"
        required: true
        default: "runtimes-2026-05-29"

permissions:
  contents: write

jobs:
  plan:
    name: select runtimes
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.select.outputs.list }}
      php: ${{ steps.select.outputs.php }}
      node: ${{ steps.select.outputs.node }}
      ollama: ${{ steps.select.outputs.ollama }}
      postgres: ${{ steps.select.outputs.postgres }}
      redis: ${{ steps.select.outputs.redis }}
      mysql: ${{ steps.select.outputs.mysql }}
      nginx: ${{ steps.select.outputs.nginx }}
      httpd: ${{ steps.select.outputs.httpd }}
    steps:
      - uses: actions/checkout@v4
      - id: select
        env:
          RUNTIMES: ${{ inputs.runtimes }}
          REDIS_SHA256: ${{ inputs.redis_sha256 }}
          MYSQL_SHA256: ${{ inputs.mysql_sha256_aarch64 }}
        run: bash scripts/select-runtimes.sh

  build-php:
    name: build php ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.php == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14
          # x86_64 intentionally omitted: the PortBay app ships arm64-only
          # (PortBay_*_aarch64.dmg), so an Intel runtime isn't needed, and
          # GitHub's macos-13 Intel runners queue indefinitely. Re-add a
          # `{ arch: x86_64, runner: <intel-runner> }` entry if Intel is ever shipped.

    steps:
      - uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          brew update
          brew install autoconf automake bison re2c pkg-config zstd

      - name: Install PHP build driver
        run: |
          brew install php
          brew install composer

      - name: Build PHP runtime
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          ARCH: ${{ matrix.arch }}
          # static-php-cli resolves dependency download URLs via the GitHub API;
          # anonymous calls from CI runners get rate-limited (the zlib download
          # failure). Authenticate with the workflow token to lift the limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/build-php-runtime.sh

      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          bash scripts/sign-notarize-runtime.sh "dist/php/${{ inputs.php_version }}"

      - name: Repack after signing
        env:
          PHP_VERSION: ${{ inputs.php_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/php-fpm-${PHP_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/php/${PHP_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-${{ inputs.php_version }}-${{ matrix.arch }}
          path: |
            dist/php-fpm-${{ inputs.php_version }}-${{ matrix.arch }}.tar.zst
            dist/php-fpm-${{ inputs.php_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/php-fpm-${{ inputs.php_version }}-${{ matrix.arch }}.tar.zst.size

  build-node:
    name: build node ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.node == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build Node runtime
        env:
          NODE_VERSION: ${{ inputs.node_version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-node-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/node/${{ inputs.node_version }}"
      - name: Repack after signing
        env:
          NODE_VERSION: ${{ inputs.node_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/node-${NODE_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/node/${NODE_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-${{ inputs.node_version }}-${{ matrix.arch }}
          path: |
            dist/node-${{ inputs.node_version }}-${{ matrix.arch }}.tar.zst
            dist/node-${{ inputs.node_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/node-${{ inputs.node_version }}-${{ matrix.arch }}.tar.zst.size

  build-ollama:
    name: build ollama ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.ollama == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build Ollama runtime
        env:
          OLLAMA_VERSION: ${{ inputs.ollama_version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-ollama-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/ollama/${{ inputs.ollama_version }}"
      - name: Repack after signing
        env:
          OLLAMA_VERSION: ${{ inputs.ollama_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/ollama-${OLLAMA_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/ollama/${OLLAMA_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ollama-${{ inputs.ollama_version }}-${{ matrix.arch }}
          path: |
            dist/ollama-${{ inputs.ollama_version }}-${{ matrix.arch }}.tar.zst
            dist/ollama-${{ inputs.ollama_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/ollama-${{ inputs.ollama_version }}-${{ matrix.arch }}.tar.zst.size

  # Database engines — arm64-only, matching build-php (the app ships arm64-only;
  # Intel macos-13 runners queue indefinitely). Re-add an x86_64 matrix entry if
  # an Intel build is ever shipped.
  build-postgres:
    name: build postgres ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.postgres == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build PostgreSQL runtime
        env:
          POSTGRES_VERSION: ${{ inputs.postgres_version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-postgres-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/postgres/${{ inputs.postgres_version }}"
      - name: Repack after signing
        env:
          POSTGRES_VERSION: ${{ inputs.postgres_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/postgres-${POSTGRES_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/postgres/${POSTGRES_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: postgres-${{ inputs.postgres_version }}-${{ matrix.arch }}
          path: |
            dist/postgres-${{ inputs.postgres_version }}-${{ matrix.arch }}.tar.zst
            dist/postgres-${{ inputs.postgres_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/postgres-${{ inputs.postgres_version }}-${{ matrix.arch }}.tar.zst.size

  build-redis:
    name: build redis ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.redis == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build Redis runtime
        env:
          REDIS_VERSION: ${{ inputs.redis_version }}
          REDIS_SHA256: ${{ inputs.redis_sha256 }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-redis-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/redis/${{ inputs.redis_version }}"
      - name: Repack after signing
        env:
          REDIS_VERSION: ${{ inputs.redis_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/redis-${REDIS_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/redis/${REDIS_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-${{ inputs.redis_version }}-${{ matrix.arch }}
          path: |
            dist/redis-${{ inputs.redis_version }}-${{ matrix.arch }}.tar.zst
            dist/redis-${{ inputs.redis_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/redis-${{ inputs.redis_version }}-${{ matrix.arch }}.tar.zst.size

  build-mysql:
    name: build mysql ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.mysql == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build MySQL runtime
        env:
          MYSQL_VERSION: ${{ inputs.mysql_version }}
          MYSQL_MACOS_TAG: ${{ inputs.mysql_macos_tag }}
          MYSQL_SHA256: ${{ inputs.mysql_sha256_aarch64 }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-mysql-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/mysql/${{ inputs.mysql_version }}"
      - name: Repack after signing
        env:
          MYSQL_VERSION: ${{ inputs.mysql_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/mysql-${MYSQL_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/mysql/${MYSQL_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mysql-${{ inputs.mysql_version }}-${{ matrix.arch }}
          path: |
            dist/mysql-${{ inputs.mysql_version }}-${{ matrix.arch }}.tar.zst
            dist/mysql-${{ inputs.mysql_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/mysql-${{ inputs.mysql_version }}-${{ matrix.arch }}.tar.zst.size

  # Web servers (manifest langs "nginx" / "apache") — aarch64-only like the
  # rest. Both scripts can cross-build x86_64 from an arm64 runner, but an
  # x86_64 archive must be run on Intel or Rosetta before it is published.
  build-nginx:
    name: build nginx ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.nginx == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build nginx runtime
        env:
          NGINX_VERSION: ${{ inputs.nginx_version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-nginx-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/nginx/${{ inputs.nginx_version }}"
      - name: Repack after signing
        env:
          NGINX_VERSION: ${{ inputs.nginx_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/nginx-${NGINX_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/nginx/${NGINX_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nginx-${{ inputs.nginx_version }}-${{ matrix.arch }}
          path: |
            dist/nginx-${{ inputs.nginx_version }}-${{ matrix.arch }}.tar.zst
            dist/nginx-${{ inputs.nginx_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/nginx-${{ inputs.nginx_version }}-${{ matrix.arch }}.tar.zst.size

  build-httpd:
    name: build httpd ${{ matrix.arch }}
    needs: plan
    if: needs.plan.outputs.httpd == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-14

    steps:
      - uses: actions/checkout@v4
      - name: Install build prerequisites
        run: brew install zstd
      - name: Build Apache httpd runtime
        env:
          HTTPD_VERSION: ${{ inputs.httpd_version }}
          ARCH: ${{ matrix.arch }}
        run: bash scripts/build-httpd-runtime.sh
      - name: Developer ID sign runtime executables
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: bash scripts/sign-notarize-runtime.sh "dist/httpd/${{ inputs.httpd_version }}"
      - name: Repack after signing
        env:
          HTTPD_VERSION: ${{ inputs.httpd_version }}
          ARCH: ${{ matrix.arch }}
        run: |
          archive="dist/httpd-${HTTPD_VERSION}-${ARCH}.tar.zst"
          tar -C "dist/httpd/${HTTPD_VERSION}" --zstd -cf "$archive" .
          shasum -a 256 "$archive" | awk '{print $1}' > "$archive.sha256"
          wc -c < "$archive" | tr -d ' ' > "$archive.size"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: httpd-${{ inputs.httpd_version }}-${{ matrix.arch }}
          path: |
            dist/httpd-${{ inputs.httpd_version }}-${{ matrix.arch }}.tar.zst
            dist/httpd-${{ inputs.httpd_version }}-${{ matrix.arch }}.tar.zst.sha256
            dist/httpd-${{ inputs.httpd_version }}-${{ matrix.arch }}.tar.zst.size

  publish:
    name: publish manifest + release
    needs: [plan, build-php, build-node, build-ollama, build-postgres, build-redis, build-mysql, build-nginx, build-httpd]
    # Unselected build jobs are skipped, and a skipped need skips this job by
    # default. Run unless something failed or was cancelled.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts
        run: |
          mkdir -p dist
          find artifacts -type f \( \
            -name 'php-fpm-*' -o -name 'node-*' -o -name 'ollama-*' \
            -o -name 'postgres-*' -o -name 'redis-*' -o -name 'mysql-*' \
            -o -name 'nginx-*' -o -name 'httpd-*' \
          \) -exec cp {} dist/ \;
          ls -lah dist

      # This release becomes releases/latest, so its manifest replaces the one
      # every installed app reads. Start from the live one so a subset run
      # cannot drop a runtime it did not rebuild.
      - name: Fetch live manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p live
          gh release download --repo "${{ github.repository }}" --pattern manifest.json --dir live
          test -s live/manifest.json

      - name: Generate manifest
        env:
          SELECTED: ${{ needs.plan.outputs.list }}
        run: |
          node scripts/generate-manifest.mjs \
            dist \
            "https://github.com/portbay-app/portbay-runtimes/releases/download/${{ inputs.release_tag }}" \
            --live live/manifest.json \
            --selected "$SELECTED" \
            --require php@8.4.21

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Sign manifest
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # `tauri signer sign` prints a human banner to stdout AND emits the
          # detached signature on the line after "Public signature:". Capture
          # THAT line into a var (it also writes its own .sig, so don't redirect
          # stdout straight onto that path — the old bug captured the banner text
          # instead of the signature, and verification failed).
          sig="$(tauri signer sign dist/manifest.json | awk '/Public signature:/{getline; print; exit}')"
          printf '%s' "$sig" > dist/manifest.json.sig
          # Fail fast if the captured signature isn't a valid base64 minisign blob.
          base64 -d < dist/manifest.json.sig | head -1 | grep -q 'untrusted comment'

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED: ${{ needs.plan.outputs.list }}
        run: |
          built=""
          for r in ${SELECTED//,/ }; do
            case "$r" in
              php)      built+=", PHP ${{ inputs.php_version }}" ;;
              node)     built+=", Node.js ${{ inputs.node_version }}" ;;
              ollama)   built+=", Ollama ${{ inputs.ollama_version }}" ;;
              postgres) built+=", PostgreSQL ${{ inputs.postgres_version }}" ;;
              mysql)    built+=", MySQL ${{ inputs.mysql_version }}" ;;
              redis)    built+=", Redis ${{ inputs.redis_version }}" ;;
              nginx)    built+=", nginx ${{ inputs.nginx_version }}" ;;
              httpd)    built+=", Apache httpd ${{ inputs.httpd_version }}" ;;
            esac
          done
          gh release create "${{ inputs.release_tag }}" \
            --title "PortBay runtimes ${{ inputs.release_tag }}" \
            --notes "PortBay managed runtimes built in this release: ${built#, }. The manifest also carries every entry of the previous one that was not rebuilt." \
            dist/*
